name: Knowledge Forge CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Forked PRs receive no production secrets or privileged credentials.
permissions:
  contents: read

concurrency:
  group: knowledge-forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out public source without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable commit pin
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, immutable commit pin
        with:
          python-version: ${{ matrix.python }}
      - name: Validate read-only installer prerequisites
        run: bin/knowledge-forge-install-agent --check-only
      - name: Check ordinary CLI and review-only CLI surfaces
        run: |
          bin/knowledge-forge --help >/dev/null
          bin/knowledge-forge-authoring --help >/dev/null
          bin/knowledge-forge-review synthetic-projections >/dev/null
      - name: Install Poppler PDF text extraction test prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
      - name: Run complete Python standard-library regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: python -m unittest discover -s tests

  windows:
    # P3B-CP1: native Windows (cmd.exe, no WSL/Git Bash), ordinary install only.
    name: Native Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        shell: cmd
    env:
      KF_REQUIRE_WINDOWS_E2E: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out public source without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable commit pin
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, immutable commit pin
        with:
          python-version: ${{ matrix.python }}
      - name: Pin the selected interpreter by absolute path
        run: python -I -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('KNOWLEDGE_FORGE_PYTHON=' + sys.executable + '\n')"
      - name: Prove LF-pinned files kept their bytes on a Windows checkout
        run: python -I -c "import subprocess, sys; rows = subprocess.run(['git', 'ls-files', '--eol'], capture_output=True, text=True, check=True).stdout.splitlines(); bad = [r for r in rows if 'w/crlf' in r and not r.endswith(('.cmd', '.bat'))]; print('\n'.join(bad)); sys.exit(1 if bad else 0)"
      - name: Native installer check-only (no writes)
        run: bin\knowledge-forge-install-agent.cmd --check-only
      - name: Native installer into the default per-user prefix
        run: bin\knowledge-forge-install-agent.cmd
      - name: Exact repeat install is idempotent
        run: bin\knowledge-forge-install-agent.cmd
      - name: Installed consumer command works
        run: '"%LOCALAPPDATA%\ToadAid\knowledge-forge\bin\knowledge-forge.exe" --help'
      - name: Installed authoring command works
        run: '"%LOCALAPPDATA%\ToadAid\knowledge-forge\bin\knowledge-forge-authoring.exe" --help'
      - name: No operator surface was installed
        run: python -I -c "import os, pathlib, sys; root = pathlib.Path(os.environ['LOCALAPPDATA'], 'ToadAid', 'knowledge-forge'); hits = [str(p) for p in root.rglob('*operator*')]; names = sorted(p.name for p in (root / 'bin').iterdir()); print(names, hits); sys.exit(0 if not hits and names == ['knowledge-forge-authoring.exe', 'knowledge-forge.exe'] else 1)"
      - name: Run complete Python standard-library suite natively
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

  required:
    # Stable check name for the later human-managed main ruleset.
    name: Knowledge Forge CI / required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [regression, windows]
    if: always()
    steps:
      - name: Refuse if any Linux or native Windows entry failed, was cancelled or skipped
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          test "$REGRESSION_RESULT" = 'success'
          test "$WINDOWS_RESULT" = 'success'
